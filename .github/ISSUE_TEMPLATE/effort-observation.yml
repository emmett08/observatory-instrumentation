name: Optional effort observation
description: Record an occasional declared effort summary; keep private activity and sampled responses off GitHub.
title: "[Effort observation] "
body:
  - type: markdown
    attributes:
      value: |
        This public issue is an optional self-report. It is supporting evidence, not a direct measurement or a probability-sampled response. Unknown effort is acceptable. Do not infer hours from CI duration, commit timestamps or an assistant's estimate.

        Use the private generated review form for sampled calibration. Its response is bound to a frozen frame and selected intervals. Do not attach that response file or raw activity here. This issue is not automatically inserted into the estimator.
  - type: input
    id: protocol
    attributes:
      label: Protocol ID
      value: "observatory-instrumentation-demo-v1"
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task issue and related PR
      description: Link the issue and PR to which this observation applies. The posting account need not identify the person who performed the work.
      placeholder: "https://github.com/emmett08/observatory-instrumentation/issues/<number>"
    validations:
      required: true
  - type: input
    id: participant
    attributes:
      label: Participant pseudonym (optional)
      description: Supply only a study pseudonym suitable for public disclosure.
  - type: input
    id: window
    attributes:
      label: Observation window (UTC)
      description: Give the start and end of the covered period, or write unknown. The window itself is not an effort duration.
    validations:
      required: true
  - type: dropdown
    id: basis
    attributes:
      label: Observation basis
      options:
        - Unknown / unavailable
        - Participant recall
        - Participant timer or contemporaneous notes
        - Other declared evidence (explain below)
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: Human person-minutes (optional)
      description: Enter a supported value or range, or unknown. Enter zero only for explicitly observed no work.
      placeholder: "unknown"
  - type: dropdown
    id: role
    attributes:
      label: Work role
      options:
        - Unknown / mixed (explain below)
        - Specification
        - Implementation
        - Review
        - Testing
        - Coordination
        - Repair
        - Other
  - type: textarea
    id: scope
    attributes:
      label: Scope, overlap and uncertainty
      description: Explain what is included and possible double counting. Exclude window titles, file paths, credentials, prompts and private responses.
  - type: checkboxes
    id: provenance
    attributes:
      label: Provenance
      options:
        - label: I understand this is declared supporting evidence and is not automatically used as a sampled response or accepted as ground truth.
          required: true
