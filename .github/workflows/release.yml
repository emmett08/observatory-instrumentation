name: Build versioned CLI release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Validate and build supported CLI archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go test ./...
          go vet ./...
          mkdir -p release
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            platform="${target%-*}"
            architecture="${target#*-}"
            mkdir -p "release/$target"
            CGO_ENABLED=0 GOOS="$platform" GOARCH="$architecture" go build -trimpath \
              -ldflags "-s -w -X main.version=$RELEASE_TAG" \
              -o "release/$target/observatory-instrumentation" ./cmd/observatory-instrumentation
            cp LICENSE "release/$target/LICENSE"
            tar -czf "release/observatory-instrumentation-$target.tar.gz" -C "release/$target" observatory-instrumentation LICENSE
          done
          cd release
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Create a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes release/*.tar.gz release/SHA256SUMS
